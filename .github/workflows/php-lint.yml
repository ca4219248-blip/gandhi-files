name: PHP syntax check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint every PHP file
        run: |
          fail=0
          while IFS= read -r file; do
            php -l "$file" || fail=1
          done < <(find . -name '*.php' -not -path './vendor/*')
          exit $fail
